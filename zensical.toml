[project]
site_name = "dj-rest-jwt"
site_description = "Secure, API-first JWT authentication for Django, built on django-allauth."
site_url = "https://memetrusidovski.github.io/dj-rest-jwt/"
repo_url = "https://github.com/memetrusidovski/dj-rest-jwt"
repo_name = "dj-rest-jwt"
edit_uri = "edit/main/docs/"
copyright = "MIT licensed"
nav = [
  { "Home" = "index.md" },
  { "Quick start" = "quickstart.md" },
  { "Guides" = [
    { "Cookies or headers" = "guides/transports.md" },
    { "JavaScript client" = "guides/js-client.md" },
    { "Staying signed in" = "guides/sessions.md" },
    { "Emails: codes, links, templates" = "guides/emails.md" },
    { "MFA and passkeys" = "guides/mfa-passkeys.md" },
    { "Social login" = "guides/social-login.md" },
    { "Protecting your API" = "guides/your-api.md" },
    { "Django admin" = "guides/admin.md" },
    { "Signup anti-spam" = "guides/anti-spam.md" },
  ] },
  { "Reference" = [
    { "Endpoints" = "reference/endpoints.md" },
    { "Settings" = "reference/settings.md" },
    { "System checks" = "reference/checks.md" },
  ] },
  { "Security" = "security.md" },
  { "Contributing" = "contributing.md" },
]

[project.theme]
language = "en"
features = [
  "content.action.edit",
  "content.code.annotate",
  "content.code.copy",
  "content.tabs.link",
  "navigation.footer",
  "navigation.instant",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "indigo"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.markdown_extensions]
admonition = {}
attr_list = {}
def_list = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.inlinehilite = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
