{% load static %}<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="dj-rest-jwt demo - every auth endpoint, live">
    <title>{% block title %}dj-rest-jwt demo{% endblock %}</title>

    <style>
      /* ---------------------------------------------------------------
         Design tokens. Light palette on :root, dark swapped under a media
         query, so the demo follows the OS setting without any JS.
         --------------------------------------------------------------- */
      :root {
        --bg:            #f6f7f9;
        --bg-elevated:   #ffffff;
        --bg-sunken:     #eef0f4;
        --border:        #e2e5eb;
        --border-strong: #cbd1db;
        --text:          #16191f;
        --text-muted:    #626a78;
        --text-faint:    #8b93a1;
        --accent:        #4f46e5;
        --accent-hover:  #4338ca;
        --accent-soft:   #eef2ff;
        --accent-text:   #ffffff;
        --ok:            #067647;
        --ok-soft:       #e6f6ee;
        --warn:          #a25200;
        --warn-soft:     #fdf1e3;
        --err:           #b42318;
        --err-soft:      #fdeceb;
        --shadow:        0 1px 2px rgba(16, 24, 40, .05), 0 8px 24px -12px rgba(16, 24, 40, .18);
        --radius:        10px;
        --radius-sm:     7px;
        --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
        --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg:            #0d1017;
          --bg-elevated:   #151922;
          --bg-sunken:     #1c212c;
          --border:        #262c38;
          --border-strong: #363e4d;
          --text:          #e8eaee;
          --text-muted:    #9aa3b2;
          --text-faint:    #6b7482;
          --accent:        #7c74f2;
          --accent-hover:  #918bf5;
          --accent-soft:   #1e1d3a;
          --accent-text:   #0d1017;
          --ok:            #4ade80;
          --ok-soft:       #10251b;
          --warn:          #fbbf24;
          --warn-soft:     #2a1f0a;
          --err:           #fb7185;
          --err-soft:      #2c1218;
          --shadow:        0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px -12px rgba(0, 0, 0, .7);
        }
      }

      *, *::before, *::after { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: var(--sans);
        font-size: 15px;
        line-height: 1.55;
        color: var(--text);
        background: var(--bg);
        -webkit-font-smoothing: antialiased;
      }

      a { color: var(--accent); text-decoration: none; }
      a:hover { text-decoration: underline; }

      h1, h2, h3 { margin: 0; font-weight: 640; letter-spacing: -.012em; }

      code, pre { font-family: var(--mono); }

      /* ---------- Header ---------- */
      .site-header {
        position: sticky;
        top: 0;
        z-index: 20;
        background: color-mix(in srgb, var(--bg-elevated) 88%, transparent);
        backdrop-filter: saturate(180%) blur(12px);
        border-bottom: 1px solid var(--border);
      }
      .site-header__inner {
        max-width: 1120px;
        margin: 0 auto;
        padding: 0 24px;
        height: 58px;
        display: flex;
        align-items: center;
        gap: 20px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 9px;
        font-weight: 660;
        font-size: 15px;
        color: var(--text);
        white-space: nowrap;
      }
      .brand:hover { text-decoration: none; }
      .brand__mark {
        width: 26px; height: 26px;
        display: grid; place-items: center;
        border-radius: 7px;
        background: var(--accent);
        color: var(--accent-text);
        font-size: 13px;
        font-weight: 700;
      }
      .brand__tag {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: .04em;
        text-transform: uppercase;
        color: var(--text-faint);
        border-left: 1px solid var(--border-strong);
        padding-left: 10px;
        margin-left: 2px;
      }
      .site-header__links { margin-left: auto; display: flex; gap: 18px; align-items: center; }
      .site-header__links a { color: var(--text-muted); font-size: 13.5px; font-weight: 500; }
      .site-header__links a:hover { color: var(--text); text-decoration: none; }
      @media (max-width: 720px) { .site-header__links, .brand__tag { display: none; } }

      /* ---------- Layout ---------- */
      .shell {
        max-width: 1120px;
        margin: 0 auto;
        padding: 28px 24px 72px;
        display: grid;
        grid-template-columns: 216px minmax(0, 1fr);
        gap: 32px;
        align-items: start;
      }
      @media (max-width: 900px) {
        .shell { grid-template-columns: minmax(0, 1fr); gap: 20px; }
      }

      /* ---------- Sidebar nav ---------- */
      .sidenav { position: sticky; top: 86px; }
      @media (max-width: 900px) { .sidenav { position: static; } }
      .sidenav__group + .sidenav__group { margin-top: 20px; }
      .sidenav__label {
        font-size: 10.5px;
        font-weight: 700;
        letter-spacing: .08em;
        text-transform: uppercase;
        color: var(--text-faint);
        padding: 0 10px 7px;
      }
      .sidenav a {
        display: block;
        padding: 6px 10px;
        border-radius: var(--radius-sm);
        color: var(--text-muted);
        font-size: 13.5px;
        font-weight: 500;
      }
      .sidenav a:hover { background: var(--bg-sunken); color: var(--text); text-decoration: none; }
      .sidenav a.is-active {
        background: var(--accent-soft);
        color: var(--accent);
        font-weight: 600;
      }
      @media (max-width: 900px) {
        .sidenav { display: flex; flex-wrap: wrap; gap: 6px; }
        .sidenav__group { margin: 0 !important; display: contents; }
        .sidenav__label { display: none; }
        .sidenav a { border: 1px solid var(--border); background: var(--bg-elevated); }
      }

      /* ---------- Page heading ---------- */
      .page-head { margin-bottom: 20px; }
      .page-head h1 { font-size: 22px; }
      .page-head p { margin: 6px 0 0; color: var(--text-muted); font-size: 14px; max-width: 62ch; }
      .endpoint {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        margin-top: 12px;
        padding: 3px 9px 3px 3px;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: var(--bg-elevated);
        font-family: var(--mono);
        font-size: 12px;
        color: var(--text-muted);
      }
      .endpoint .verb {
        padding: 1px 7px;
        border-radius: 999px;
        background: var(--accent-soft);
        color: var(--accent);
        font-weight: 700;
        font-size: 10.5px;
        letter-spacing: .04em;
      }

      /* ---------- Card ---------- */
      .card {
        background: var(--bg-elevated);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: 22px;
      }
      .card + .card { margin-top: 18px; }
      .card__title { font-size: 15px; margin-bottom: 2px; }
      .card__hint { color: var(--text-muted); font-size: 13px; margin: 0 0 18px; }

      .split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; align-items: start; }
      /* Keep the response in view while scrolling a tall left column. */
      .split > .response { position: sticky; top: 86px; }
      @media (max-width: 1000px) {
        .split { grid-template-columns: minmax(0, 1fr); }
        .split > .response { position: static; }
      }

      /* ---------- Forms ---------- */
      .field + .field { margin-top: 14px; }
      .field label {
        display: block;
        font-size: 13px;
        font-weight: 570;
        margin-bottom: 5px;
        color: var(--text);
      }
      .field input, .field textarea {
        width: 100%;
        padding: 8px 11px;
        font: inherit;
        font-size: 14px;
        color: var(--text);
        background: var(--bg);
        border: 1px solid var(--border-strong);
        border-radius: var(--radius-sm);
        transition: border-color .12s, box-shadow .12s;
      }
      .field input::placeholder { color: var(--text-faint); }
      .field input:focus, .field textarea:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent);
      }
      .field small { display: block; margin-top: 5px; color: var(--text-faint); font-size: 12px; }
      .field--mono input { font-family: var(--mono); font-size: 13px; }

      .actions { margin-top: 20px; display: flex; gap: 9px; flex-wrap: wrap; align-items: center; }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        padding: 8px 15px;
        font: inherit;
        font-size: 13.5px;
        font-weight: 570;
        border-radius: var(--radius-sm);
        border: 1px solid transparent;
        cursor: pointer;
        transition: background .12s, border-color .12s, opacity .12s;
      }
      .btn:disabled { opacity: .55; cursor: not-allowed; }
      .btn--primary { background: var(--accent); color: var(--accent-text); }
      .btn--primary:hover:not(:disabled) { background: var(--accent-hover); }
      .btn--ghost { background: var(--bg-elevated); color: var(--text); border-color: var(--border-strong); }
      .btn--ghost:hover:not(:disabled) { background: var(--bg-sunken); }
      .btn--danger { background: var(--bg-elevated); color: var(--err); border-color: color-mix(in srgb, var(--err) 40%, var(--border)); }
      .btn--danger:hover:not(:disabled) { background: var(--err-soft); }

      .spinner {
        width: 13px; height: 13px;
        border: 2px solid color-mix(in srgb, currentColor 30%, transparent);
        border-top-color: currentColor;
        border-radius: 50%;
        animation: spin .6s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }

      /* ---------- Response panel ---------- */
      .response {
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--bg-sunken);
        overflow: hidden;
      }
      .response__bar {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 9px 13px;
        border-bottom: 1px solid var(--border);
        background: var(--bg-elevated);
      }
      .response__bar h3 { font-size: 12px; font-weight: 640; color: var(--text-muted); }
      .status {
        font-family: var(--mono);
        font-size: 11.5px;
        font-weight: 700;
        padding: 2px 8px;
        border-radius: 999px;
        margin-left: auto;
      }
      .status--ok   { background: var(--ok-soft);   color: var(--ok); }
      .status--err  { background: var(--err-soft);  color: var(--err); }
      .status--warn { background: var(--warn-soft); color: var(--warn); }
      .response pre {
        margin: 0;
        padding: 13px;
        font-size: 12.5px;
        line-height: 1.6;
        white-space: pre-wrap;
        word-break: break-word;
        max-height: 380px;
        overflow: auto;
        color: var(--text);
      }
      .response__empty {
        padding: 26px 13px;
        text-align: center;
        color: var(--text-faint);
        font-size: 13px;
      }

      /* ---------- Session bar ---------- */
      .session {
        display: flex;
        align-items: center;
        gap: 11px;
        flex-wrap: wrap;
        padding: 11px 14px;
        margin-bottom: 20px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--bg-elevated);
        font-size: 13px;
      }
      .session__dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
      .session--on  .session__dot { background: var(--ok); box-shadow: 0 0 0 3px var(--ok-soft); }
      .session--off .session__dot { background: var(--text-faint); }
      .session code {
        font-size: 12px;
        padding: 2px 7px;
        border-radius: 5px;
        background: var(--bg-sunken);
        color: var(--text-muted);
        max-width: 260px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .session__actions { margin-left: auto; display: flex; gap: 7px; }
      .btn--xs { padding: 4px 10px; font-size: 12px; }

      /* ---------- Misc ---------- */
      .note {
        padding: 11px 14px;
        border-radius: var(--radius-sm);
        border: 1px solid var(--border);
        background: var(--bg-sunken);
        color: var(--text-muted);
        font-size: 13px;
      }
      .note--accent { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 25%, transparent); color: var(--text); }
      .note strong { color: var(--text); }

      .codes { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 7px; margin-top: 12px; }
      .codes span {
        font-family: var(--mono);
        font-size: 13px;
        text-align: center;
        padding: 6px;
        border-radius: 5px;
        background: var(--bg-sunken);
        border: 1px solid var(--border);
      }

      .qr { display: block; width: 190px; height: 190px; margin: 14px 0; border-radius: var(--radius-sm); background: #fff; padding: 8px; border: 1px solid var(--border); }

      [x-cloak] { display: none !important; }
    </style>

    <script defer src="https://cdn.jsdelivr.net/npm/axios@1.7.9/dist/axios.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>
  </head>

  <body>
    {% csrf_token %}

    <header class="site-header">
      <div class="site-header__inner">
        <a class="brand" href="{% url 'home' %}">
          <span class="brand__mark">jwt</span>
          dj-rest-jwt
          <span class="brand__tag">demo</span>
        </a>
        <nav class="site-header__links">
          <a href="{% url 'api_docs' %}">API docs</a>
          <a href="https://dj-rest-jwt.readthedocs.io/" target="_blank" rel="noopener">Documentation</a>
          <a href="https://github.com/memetrusidovski/dj-rest-jwt" target="_blank" rel="noopener">Source</a>
        </nav>
      </div>
    </header>

    <div class="shell">
      <nav class="sidenav">
        {% include "fragments/sidenav.html" %}
      </nav>

      <main>
        {% block content %}{% endblock %}
      </main>
    </div>

    <script>
      /* Django's CSRF cookie/header names differ from axios' defaults. DRF's
         TokenAuthentication doesn't enforce CSRF, but sending it anyway keeps
         this demo honest if you switch to SessionAuthentication. */
      document.addEventListener('DOMContentLoaded', () => {
        axios.defaults.xsrfCookieName = 'csrftoken';
        axios.defaults.xsrfHeaderName = 'X-CSRFToken';
      });

      document.addEventListener('alpine:init', () => {
        /* The one piece of state every page shares: the auth token handed back
           by /login/. Holding it here is what lets the other pages just work
           instead of asking you to paste it into each form. */
        Alpine.store('auth', {
          token: localStorage.getItem('djrj.token') || '',
          username: localStorage.getItem('djrj.username') || '',

          get on() { return !!this.token; },

          set(token, username) {
            this.token = token || '';
            this.username = username || '';
            localStorage.setItem('djrj.token', this.token);
            localStorage.setItem('djrj.username', this.username);
          },

          clear() {
            this.token = '';
            this.username = '';
            localStorage.removeItem('djrj.token');
            localStorage.removeItem('djrj.username');
          },

          header() {
            return this.token ? { Authorization: 'Token ' + this.token } : {};
          },
        });
      });

      /* Shared behaviour for every form on the site: fire a request, keep the
         raw response around so you can see exactly what the API said. */
      function apiForm(config) {
        return {
          fields: Object.assign({}, config.fields || {}),
          loading: false,
          res: null,

          get authed() { return Alpine.store('auth').on; },

          reset() {
            this.fields = Object.assign({}, config.fields || {});
            this.res = null;
          },

          /* `options.replace` sends only options.data, for the pages where one
             component talks to two endpoints that don't share a field set. */
          async send(options) {
            options = options || {};
            const method = (options.method || config.method || 'post').toLowerCase();
            const url = options.url || config.url;
            const body = options.replace
              ? Object.assign({}, options.data)
              : Object.assign({}, this.fields, options.data || {});

            this.loading = true;
            try {
              const request = { method: method, url: url, headers: {} };
              if (options.auth ?? config.auth) {
                Object.assign(request.headers, Alpine.store('auth').header());
              }
              if (method === 'get' || method === 'delete') {
                request.params = options.params;
              } else {
                request.data = body;
              }

              const response = await axios(request);
              this.res = { status: response.status, data: response.data };
              if (config.onSuccess) config.onSuccess(response.data, this);
            } catch (error) {
              this.res = error.response
                ? { status: error.response.status, data: error.response.data }
                : { status: 0, data: { detail: error.message + ' (is the server running?)' } };
              if (config.onError) config.onError(this.res, this);
            } finally {
              this.loading = false;
            }
          },

          get ok() {
            return !!this.res && this.res.status >= 200 && this.res.status < 300;
          },

          get statusClass() {
            if (!this.res) return '';
            if (this.ok) return 'status--ok';
            if (this.res.status === 0 || this.res.status >= 500) return 'status--warn';
            return 'status--err';
          },

          get pretty() {
            return this.res ? JSON.stringify(this.res.data, null, 2) : '';
          },
        };
      }
    </script>
    {% block script %}{% endblock %}
  </body>
</html>
