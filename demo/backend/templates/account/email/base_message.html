{% comment %}
  Shared HTML layout for every allauth email in this project. allauth sends
  <name>_message.html as the HTML part whenever it exists, next to the plain
  text <name>_message.txt. Inline styles only: most mail clients drop <style>.
{% endcomment %}{% load i18n %}<!doctype html>
<html lang="en">
<body style="margin:0;padding:24px;background:#f4f4f7;font-family:-apple-system,Segoe UI,Roboto,sans-serif;color:#1f2330">
  <table role="presentation" width="100%" style="max-width:520px;margin:0 auto;background:#ffffff;border-radius:12px;padding:32px">
    <tr><td>
      <p style="margin:0 0 24px;font-size:20px;font-weight:600;color:#4f46e5">Demo App</p>
      {% block content %}{% endblock content %}
      <p style="margin:32px 0 0;font-size:13px;color:#6b7080">
        {% blocktranslate %}If you didn't ask for this, you can ignore this email.{% endblocktranslate %}
      </p>
    </td></tr>
  </table>
</body>
</html>
