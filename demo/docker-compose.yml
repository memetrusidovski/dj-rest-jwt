services:
  backend:
    build:
      context: ..
      dockerfile: demo/backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}

  spa:
    image: node:22-alpine
    working_dir: /app/demo/spa
    command: sh -c "cd /app/js && npm install && cd /app/demo/spa && npm install && npx vite --host"
    ports:
      - "5173:5173"
    environment:
      - BACKEND_URL=http://backend:8000
    volumes:
      - ../js:/app/js
      - ./spa:/app/demo/spa
      - /app/js/node_modules
      - /app/demo/spa/node_modules
    depends_on:
      - backend
