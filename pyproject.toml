[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "dj-rest-jwt"
dynamic = ["version"]
description = "Secure, API-first JWT authentication for Django, built on django-allauth headless."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "memetrusidovski" }]
requires-python = ">=3.12"
keywords = ["django", "jwt", "authentication", "allauth", "headless", "api", "rest-framework", "passkeys", "mfa"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Software Development",
]
dependencies = [
    "Django>=6.0",
    "djangorestframework>=3.16",
    # The token strategy builds on allauth's JWT internals; widen this range
    # only after the test suite passes against the new release.
    "django-allauth[socialaccount,mfa,headless]>=65.22,<66",
    "PyJWT>=2.8",
    "cryptography>=48.0.1",   # statically linked OpenSSL fix (GHSA-537c-gmf6-5ccf)
    "argon2-cffi>=23.1",
    "requests>=2.31",
]

[project.urls]
Homepage = "https://github.com/memetrusidovski/dj-rest-jwt"
Documentation = "https://memetrusidovski.github.io/dj-rest-jwt/"
Source = "https://github.com/memetrusidovski/dj-rest-jwt"
Issues = "https://github.com/memetrusidovski/dj-rest-jwt/issues"

# Development only; never installed for users. `uv sync` installs "dev".
[dependency-groups]
test = [
    "coverage>=7.6",
    "fido2>=2.0",
    "time-machine>=2.16",
    "unittest-xml-reporting>=3.2",
]
lint = ["ruff>=0.14"]
docs = ["zensical>=0.1.1,<0.2"]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
]

[tool.hatch.version]
path = "dj_rest_jwt/__version__.py"

[tool.hatch.build.targets.wheel]
packages = ["dj_rest_jwt"]
exclude = ["dj_rest_jwt/tests"]

[tool.hatch.build.targets.sdist]
include = ["/dj_rest_jwt", "/runtests.py", "/README.md", "/LICENSE", "/AUTHORS"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["demo", "starter", "docs", "js"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["F403"]

[tool.coverage.run]
source = ["dj_rest_jwt"]
omit = ["*/migrations/*", "dj_rest_jwt/tests/*"]

[tool.coverage.report]
exclude_also = [
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
