[tox]
skipsdist = true
envlist =
    py{312,313,314}-django{60,61}
    flake8

[gh-actions]
python =
    3.12: py312-django60, py312-django61
    3.13: py313-django60, py313-django61, flake8
    3.14: py314-django60, py314-django61

[testenv]
commands =
    pip install -e .
    python ./runtests.py
deps =
    -r dj_rest_jwt/tests/requirements.txt
    django60: Django>=6.0,<6.1
    django61: Django>=6.1,<6.2

[testenv:coverage]
commands =
    pip install -e .
    coverage run ./runtests.py
    coverage report
deps =
    -r dj_rest_jwt/tests/requirements.txt

[testenv:flake8]
commands =
    flake8 {toxinidir}/dj_rest_jwt
deps =
    flake8==7.1.1
