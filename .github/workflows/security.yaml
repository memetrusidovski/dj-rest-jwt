name: Security Checks
on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  bandit:
    runs-on: ubuntu-latest
    name: Bandit SAST
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - name: Run Bandit
        run: uvx --from 'bandit[toml]' bandit -r dj_rest_jwt/ --exclude dj_rest_jwt/tests -s B105 -f json -o bandit-results.json
      - name: Display results
        if: always()
        run: uvx --from 'bandit[toml]' bandit -r dj_rest_jwt/ --exclude dj_rest_jwt/tests -s B105 -f screen
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-results
          path: bandit-results.json

  codeql:
    runs-on: ubuntu-latest
    name: CodeQL Analysis
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python
          queries: security-and-quality
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:python"

  pip-audit:
    runs-on: ubuntu-latest
    name: pip-audit Dependency Scan
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - name: Run pip-audit on the locked dependencies
        run: |
          uv export --frozen --all-groups --no-emit-project --no-hashes -o requirements-audit.txt
          uvx pip-audit -r requirements-audit.txt --strict --desc

  semgrep:
    runs-on: ubuntu-latest
    name: Semgrep SAST
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run Semgrep
        run: semgrep scan --config auto --config p/django --error dj_rest_jwt/
