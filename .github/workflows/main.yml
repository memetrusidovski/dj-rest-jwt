name: Lint, Build and Test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uv run --only-group lint ruff check dj_rest_jwt runtests.py

  build:
    runs-on: ubuntu-latest
    name: Build
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  test:
    runs-on: ubuntu-latest
    name: Test Python ${{ matrix.python-version }} + Django ${{ matrix.django-version }}
    needs: [build]
    strategy:
      matrix:
        python-version: ['3.12', '3.13', '3.14']
        django-version: ['6.0', '6.1']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        run: |
          uv run --with "django~=${{ matrix.django-version }}.0" python -c "import sys, django; print(sys.version, django.get_version())"
          uv run --with "django~=${{ matrix.django-version }}.0" coverage run runtests.py
          uv run coverage report

  js:
    runs-on: ubuntu-latest
    name: JS client (unit + end-to-end against the demo backend)
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: |
          uv sync
          cd js && npm install
      - name: Typecheck and unit tests
        working-directory: js
        run: npx tsc -p tsconfig.json --noEmit && npx vitest run test/client.test.ts
      - name: End-to-end
        run: |
          mkdir -p /tmp/mails
          cd demo/backend
          uv run python manage.py migrate -v0
          EMAIL_FILE_PATH=/tmp/mails uv run python manage.py runserver 8765 --noreload &
          for i in $(seq 1 30); do curl -sf -o /dev/null localhost:8765/api/auth/v1/config && break; sleep 1; done
          cd ../../js
          E2E_URL=http://localhost:8765 E2E_MAILS=/tmp/mails npx vitest run test/e2e.test.ts
      - name: Build demo SPA
        working-directory: demo/spa
        run: npm install && npm run build
